name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spotlessCheck
      - run: ./gradlew lintDebug lintRelease test assembleDebug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: "**/build/reports"

  build-app:
    name: Build the e2e APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: e2e/fetch-banks.sh
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

  e2e:
    name: Maestro e2e (part ${{ matrix.part }} of 5)
    runs-on: ubuntu-latest
    needs: build-app
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5]
    env:
      API_LEVEL: 35
      E2E_APK: build/e2e-apk/app-debug.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: e2e-apk
          path: build/e2e-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Cache the emulator snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-pixel7
      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot created."
      - name: Run the flows
        id: flows
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_FLOWS_FAILED_MARKER: ${{ runner.temp }}/e2e-flows-failed
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: e2e/run.sh --part ${{ matrix.part }}/5
      - name: Check whether a flow failed or the emulator did
        id: emulator
        if: steps.flows.outcome == 'failure'
        run: |
          if [ -f "$RUNNER_TEMP/e2e-flows-failed" ]; then
            echo "A flow failed on a working emulator"
            exit 1
          fi
          echo "The emulator failed to start or died during the run, retrying on a fresh one"
          echo "broken=true" >> "$GITHUB_OUTPUT"
      - name: Run the flows again on a fresh emulator
        if: steps.emulator.outputs.broken == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: e2e/run.sh --part ${{ matrix.part }}/5
      - uses: actions/upload-artifact@v4
        if: failure() || steps.flows.outcome == 'failure'
        with:
          name: e2e-part-${{ matrix.part }}
          path: ~/.maestro/tests

  e2e-result:
    name: Maestro e2e
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - if: needs.e2e.result != 'success'
        run: exit 1
