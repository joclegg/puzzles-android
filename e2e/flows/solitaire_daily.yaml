appId: com.joclegg.puzzles
name: The daily deal opens and comes back to the same game
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "game_solitaire"
    centerElement: true
- tapOn:
    id: "game_solitaire"
- waitForAnimationToEnd
- tapOn:
    id: "daily"
- waitForAnimationToEnd
- assertVisible:
    id: "game_title"
    text: "Daily.*"
- tapOn:
    id: "stock"
- tapOn:
    id: "back"
- waitForAnimationToEnd
- tapOn:
    id: "daily"
- waitForAnimationToEnd
- assertVisible:
    id: "move_count"
    text: "Moves 1"
