appId: com.joclegg.puzzles
name: The daily deal opens and comes back to the same game
---
- launchApp:
    clearState: true
- tapOn:
    id: "game_solitaire"
- tapOn:
    id: "daily"
- assertVisible:
    id: "game_title"
    text: "Daily.*"
- tapOn:
    id: "stock"
- tapOn:
    id: "back"
- tapOn:
    id: "daily"
- assertVisible:
    id: "move_count"
    text: "Moves 1"
