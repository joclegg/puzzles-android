appId: com.joclegg.puzzles
name: Kakuro - the sum helper starts increasing and can list combinations in decreasing order
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "game_kakuro"
    centerElement: true
- tapOn:
    id: "game_kakuro"
- extendedWaitUntil:
    visible:
      id: "settings"
    timeout: 120000
- tapOn:
    id: "settings"
- waitForAnimationToEnd:
    timeout: 1500
- assertNotVisible:
    id: "setting_combination_order_increasing"
- scrollUntilVisible:
    element:
      id: "setting_show_combinations"
    centerElement: true
- tapOn:
    id: "setting_show_combinations"
- scrollUntilVisible:
    element:
      id: "setting_combination_order_increasing"
    centerElement: true
- assertVisible:
    id: "setting_combination_order_increasing"
    checked: true
- tapOn:
    id: "setting_combination_order_decreasing"
- assertVisible:
    id: "setting_combination_order_decreasing"
    checked: true
- launchApp:
    arguments:
      fixture: "kakuro_empty"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "cell_r2c2"
- assertVisible:
    id: "combinations"
