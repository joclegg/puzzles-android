appId: com.joclegg.puzzles
name: Sightlines - with Pick a colour on, picking blue and tapping fills the last spot
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: "game_sightlines"
    centerElement: true
- tapOn:
    id: "game_sightlines"
- tapOn:
    id: "settings"
- tapOn:
    id: "setting_pick_colour"
- launchApp:
    arguments:
      fixture: "sightlines_one_left"
- tapOn:
    id: "colour_blue"
- tapOn:
    id: "dot_r1c2"
- assertVisible:
    id: "solved_dialog"
