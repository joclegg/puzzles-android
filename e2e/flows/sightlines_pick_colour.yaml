appId: com.joclegg.puzzles
name: Sightlines - with Pick a colour on, picking blue and tapping fills the last spot
---
- launchApp:
    clearState: true
    arguments:
      fixture: "sightlines_one_left"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "input_mode"
- tapOn:
    id: "colour_blue"
- tapOn:
    id: "dot_r1c2"
- assertVisible:
    id: "solved_dialog"
