appId: com.joclegg.puzzles
name: Turning on Reverse deals reverse games
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "game_solitaire"
    centerElement: true
- tapOn:
    id: "game_solitaire"
- waitForAnimationToEnd
- tapOn:
    id: "settings"
- waitForAnimationToEnd
- tapOn:
    id: "setting_reverse"
- tapOn:
    id: "back"
- waitForAnimationToEnd
- tapOn:
    id: "play"
- extendedWaitUntil:
    visible:
      id: "stock"
    timeout: 60000
- waitForAnimationToEnd
- assertVisible:
    id: "game_title"
    text: "Draw 1 · Reverse"
