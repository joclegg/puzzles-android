appId: com.joclegg.puzzles
name: Sightlines - start a 6 x 6 puzzle
tags:
  - fast
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "game_sightlines"
    centerElement: true
- tapOn:
    id: "game_sightlines"
- waitForAnimationToEnd
- tapOn:
    id: "size_6"
- waitForAnimationToEnd
- assertVisible:
    id: "dot_r6c6"
- assertVisible:
    id: "game_title"
    text: "6 x 6"
