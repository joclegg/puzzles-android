appId: com.joclegg.puzzles
name: Word Wheel - rules, settings and the walkthrough
---
- launchApp:
    clearState: true
    arguments:
      helpers: "on"
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "game_word_wheel"
    centerElement: true
- tapOn:
    id: "game_word_wheel"
- extendedWaitUntil:
    visible:
      id: "level_5"
    timeout: 120000
- tapOn:
    id: "level_5"
- assertVisible:
    id: "game_title"
    text: "5 letters"
- tapOn:
    id: "rules"
- tapOn:
    id: "walkthrough_start"
- assertVisible:
    id: "walkthrough_text"
    text: "Find every word in this crossword."
- tapOn:
    id: "walkthrough_next"
- tapOn:
    id: "walkthrough_close"
- tapOn:
    id: "game_menu"
- tapOn:
    id: "menu_settings"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: "setting_show_timer"
- scrollUntilVisible:
    element:
      id: "setting_show_hints"
- tapOn:
    id: "setting_show_hints"
- tapOn:
    id: "back"
- waitForAnimationToEnd:
    timeout: 1500
- assertNotVisible:
    id: "hint"
- tapOn:
    id: "game_menu"
- tapOn:
    id: "menu_solution"
- tapOn:
    id: "confirm_reveal"
- assertVisible:
    id: "words_left"
    text: "0 to find"
