appId: com.joclegg.puzzles
name: Cell-first - enter a digit and undo it
tags:
  - fast
---
- launchApp:
    clearState: true
    arguments:
      fixture: "classic_easy"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "cell_r1c3"
- tapOn:
    id: "digit_4"
- assertVisible:
    text: "4"
    childOf:
      id: "cell_r1c3"
- tapOn:
    id: "undo"
- assertNotVisible:
    text: "4"
    childOf:
      id: "cell_r1c3"
