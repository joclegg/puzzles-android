appId: com.joclegg.puzzles
name: Kakuro - filling the last cell solves the puzzle and goes back to Kakuro's Home
tags:
  - fast
---
- launchApp:
    clearState: true
    arguments:
      fixture: "kakuro_one_left"
- waitForAnimationToEnd
- tapOn:
    id: "cell_r3c3"
- tapOn:
    id: "digit_4"
- assertVisible:
    id: "solved_dialog"
- tapOn:
    id: "solved_home"
- waitForAnimationToEnd
- assertVisible:
    id: "size_6"
