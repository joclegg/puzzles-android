appId: com.joclegg.puzzles
name: Five Letters - today's word opens, keeps a guess and comes back to the same game
tags:
  - fast
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "game_five_letters"
    centerElement: true
- tapOn:
    id: "game_five_letters"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "daily"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: "game_title"
    text: "Five Letters.*"
- tapOn:
    id: "key_A"
- tapOn:
    id: "key_D"
- tapOn:
    id: "key_I"
- tapOn:
    id: "key_E"
- tapOn:
    id: "key_U"
- tapOn:
    id: "key_enter"
- launchApp:
    stopApp: true
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "game_five_letters"
    centerElement: true
- tapOn:
    id: "game_five_letters"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "daily"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    text: "A"
    childOf:
      id: "letter_r1c1"
