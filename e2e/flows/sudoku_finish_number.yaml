appId: com.joclegg.puzzles
name: Finishing a number by hand disables its button
---
- launchApp:
    clearState: true
- tapOn:
    id: "game_sudoku"
- tapOn:
    id: "settings"
- tapOn:
    id: "setting_digit_first"
- launchApp:
    arguments:
      fixture: "classic_easy"
- tapOn:
    id: "digit_1"
- tapOn:
    id: "cell_r1c8"
- tapOn:
    id: "cell_r3c1"
- tapOn:
    id: "cell_r4c6"
- tapOn:
    id: "cell_r6c2"
- tapOn:
    id: "cell_r7c3"
- tapOn:
    id: "cell_r9c7"
- assertVisible:
    id: "digit_1"
    enabled: false
