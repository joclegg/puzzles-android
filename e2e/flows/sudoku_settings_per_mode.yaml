appId: com.joclegg.puzzles
name: Settings open on the Home mode and apply to that mode
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "game_sudoku"
    centerElement: true
- tapOn:
    id: "game_sudoku"
- waitForAnimationToEnd
- tapOn:
    id: "mode_killer"
- waitForAnimationToEnd
- tapOn:
    id: "settings"
- waitForAnimationToEnd
- assertVisible:
    id: "settings_tab_killer"
    selected: true
- scrollUntilVisible:
    element:
      id: "setting_disable_completed_digits"
    centerElement: true
- tapOn:
    id: "setting_disable_completed_digits"
- assertVisible:
    id: "setting_disable_completed_digits"
    checked: false
- launchApp:
    arguments:
      fixture: "killer_one_cage"
- waitForAnimationToEnd
- assertVisible:
    id: "digit_1"
    enabled: true
- launchApp:
    arguments:
      fixture: "classic_one_left"
- waitForAnimationToEnd
- assertVisible:
    id: "digit_1"
    enabled: false
