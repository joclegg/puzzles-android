appId: com.joclegg.puzzles
name: Two Tone - with Pick a colour on, picking blue and tapping fills the last spot
---
- launchApp:
    clearState: true
    arguments:
      fixture: "two_tone_one_left"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "input_mode"
- tapOn:
    id: "colour_blue"
- tapOn:
    id: "tile_r1c2"
- assertVisible:
    id: "solved_dialog"
