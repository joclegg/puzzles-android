appId: com.joclegg.puzzles
name: Crossword - typing every answer solves the puzzle and goes back to Crossword's Home
tags:
  - fast
---
- launchApp:
    clearState: true
    arguments:
      helpers: "on"
      fixture: "crossword_one_left"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "cell_r3c3"
- inputText: "W"
- assertVisible:
    id: "solved_dialog"
- tapOn:
    id: "solved_home"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: "size_11"
