appId: com.joclegg.puzzles
name: A game in progress, and its undo history, survive the app being closed
---
- launchApp:
    clearState: true
    arguments:
      fixture: "simple"
- waitForAnimationToEnd
- tapOn:
    id: "stock"
- launchApp:
    stopApp: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "game_solitaire"
    centerElement: true
- tapOn:
    id: "game_solitaire"
- waitForAnimationToEnd
- tapOn:
    id: "continue"
- waitForAnimationToEnd
- assertVisible:
    id: "card_3C"
- tapOn:
    id: "undo"
- assertNotVisible:
    id: "card_3C"
