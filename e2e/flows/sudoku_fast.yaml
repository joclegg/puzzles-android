appId: com.joclegg.puzzles
name: Fast - a 6x6 board with numbers 1 to 6, in classic and killer
---
- launchApp:
    clearState: true
    arguments:
      fixture: "fast_one_left"
- waitForAnimationToEnd
- assertVisible:
    id: "game_title"
    text: "Classic · Fast"
- assertVisible:
    id: "cell_r6c6"
- assertNotVisible:
    id: "cell_r7c1"
- assertVisible:
    id: "digit_6"
- assertNotVisible:
    id: "digit_7"
- tapOn:
    id: "cell_r1c3"
- tapOn:
    id: "digit_3"
- assertVisible: "Great job"
- extendedWaitUntil:
    visible:
      id: "stats"
    timeout: 15000
- tapOn:
    id: "stats"
- waitForAnimationToEnd
- assertVisible:
    id: "best_classic_fast_solved"
    text: "1"
- back
- tapOn:
    id: "mode_killer"
- waitForAnimationToEnd
- tapOn:
    id: "level_fast"
- waitForAnimationToEnd
- assertVisible:
    id: "game_title"
    text: "Killer · Fast"
- assertVisible:
    id: "cell_r6c6"
- assertNotVisible:
    id: "cell_r7c1"
