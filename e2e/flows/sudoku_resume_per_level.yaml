appId: com.joclegg.puzzles
name: Each level keeps its own game in progress
---
- launchApp:
    clearState: true
    arguments:
      fixture: "classic_easy"
- tapOn:
    id: "cell_r1c3"
- tapOn:
    id: "digit_4"
- tapOn:
    id: "back"
- tapOn:
    id: "level_medium"
- assertVisible:
    id: "game_title"
    text: "Classic · Medium"
- tapOn:
    id: "back"
- tapOn:
    id: "level_easy"
- assertVisible:
    id: "resume_dialog"
- tapOn:
    id: "resume_game"
- assertVisible:
    id: "game_title"
    text: "Classic · Easy"
- assertVisible:
    text: "4"
    childOf:
      id: "cell_r1c3"
- tapOn:
    id: "back"
- tapOn:
    id: "level_easy"
- tapOn:
    id: "new_game"
- assertVisible:
    id: "game_title"
    text: "Classic · Easy"
- assertNotVisible:
    id: "resume_dialog"
