appId: com.joclegg.puzzles
name: A game in progress, and its undo history, survive the app being closed
---
- launchApp:
    clearState: true
    arguments:
      fixture: "classic_easy"
- tapOn:
    id: "cell_r1c3"
- tapOn:
    id: "digit_4"
- launchApp:
    stopApp: true
- scrollUntilVisible:
    element:
      id: "game_sudoku"
    centerElement: true
- tapOn:
    id: "game_sudoku"
- tapOn:
    id: "continue"
- assertVisible:
    text: "4"
    childOf:
      id: "cell_r1c3"
- tapOn:
    id: "undo"
- assertNotVisible:
    text: "4"
    childOf:
      id: "cell_r1c3"
