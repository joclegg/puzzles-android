appId: com.joclegg.puzzles
name: Daily puzzle - starts one level's puzzle, and resumes it the same day
---
- launchApp:
    clearState: true
    arguments:
      banks: "sudoku"
      helpers: "on"
- waitForAnimationToEnd:
    timeout: 1500
- extendedWaitUntil:
    visible:
      id: "game_sudoku"
    timeout: 10000
- tapOn:
    id: "game_sudoku"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "daily_medium"
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: "game_title"
- tapOn:
    id: "back"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "daily_medium"
- waitForAnimationToEnd:
    timeout: 1500
- assertNotVisible:
    id: "resume_dialog"
- assertVisible:
    id: "timer"
