appId: com.joclegg.puzzles
name: Daily puzzle - shows its level, starts it, and resumes it the same day
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "game_sudoku"
    centerElement: true
- tapOn:
    id: "game_sudoku"
- waitForAnimationToEnd
- assertVisible:
    text: "Daily puzzle · .*"
    childOf:
      id: "daily"
- tapOn:
    id: "daily"
- waitForAnimationToEnd
- assertVisible:
    id: "game_title"
- tapOn:
    id: "back"
- waitForAnimationToEnd
- tapOn:
    id: "daily"
- waitForAnimationToEnd
- assertNotVisible:
    id: "resume_dialog"
- assertVisible:
    id: "timer"
